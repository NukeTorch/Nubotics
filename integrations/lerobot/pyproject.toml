[project]
name = "lerobot_policy_nubotics"
version = "0.1.0"
description = "LeRobot policy type \"nubotics\": inference by Nubotics on NukeTorch"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = ["nubotics"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
